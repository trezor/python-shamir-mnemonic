[project]
name = "shamir-mnemonic"
version = "0.3.1"
description = "SLIP-39 Shamir Mnemonics"
authors = [{ name = "Trezor", email = "info@trezor.io" }]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.9"

[project.optional-dependencies]
cli = ["click>=7,<9"]

[project.scripts]
shamir = "shamir_mnemonic.cli:cli"

[dependency-groups]
dev = [
    "bip32utils>=0.3.post4,<0.4",
    "click>=7,<9",
    "pytest",
    "ruff",
]

[build-system]
requires = ["flit_core>=3.11,<4"]
build-backend = "flit_core.buildapi"

[tool.uv]
exclude-newer = "30 days"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "E741", "SIM300"]

[tool.flit.sdist]
include = ["CHANGELOG.rst", "test_*.py", "vectors.json"]
