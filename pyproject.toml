[project]
name = "shamir-mnemonic"
version = "0.3.1"
description = "SLIP-39 Shamir Mnemonics"
authors = [{ name = "Trezor", email = "info@trezor.io" }]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.9"

[project.optional-dependencies]
cli = ["click>=7,<9"]

[project.scripts]
shamir = "shamir_mnemonic.cli:cli"

[dependency-groups]
dev = [
    "bip32utils>=0.3.post4,<0.4",
    "click>=7,<9",
    "pytest",
    "black>=20",
    "isort>=5,<6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shamir_mnemonic"
module-root = ""
